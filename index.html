<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="러닝카드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>러닝 카드</title>
<style>
  :root {
    --bg: #111; --panel: #1c1c1e; --line: #2c2c2e; --text: #f2f2f7; --sub: #8e8e93; --accent: #c6ff3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", Helvetica, Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 20px; margin: 4px 0 16px; letter-spacing: -.02em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--sub); margin: 0 0 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1 1 0; min-width: 0; }
  button, .btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 12px; font-size: 16px; font-weight: 600;
    background: #2c2c2e; color: var(--text); text-align: center; cursor: pointer; display: block; width: 100%; }
  button.primary, .btn.primary { background: var(--accent); color: #111; }
  button:disabled { opacity: .45; }
  input[type=file] { display: none; }
  label.field { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  input[type=text], select { width: 100%; font-size: 18px; font-weight: 600; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #000; color: var(--text); }
  input[type=color] { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: #000; padding: 2px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .chk input { width: 20px; height: 20px; accent-color: var(--accent); }
  #status { font-size: 13px; color: var(--sub); min-height: 18px; margin-top: 8px; }
  #status.err { color: #ff6b6b; }
  #preview { width: 100%; display: block; border-radius: 12px; background: #000; }
  .thumb { width: 100%; max-height: 120px; object-fit: contain; border-radius: 8px; margin-top: 10px; background: #000; display: none; }
  .hint { font-size: 12px; color: var(--sub); margin: 8px 0 0; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>🏃 러닝 카드 만들기</h1>

  <section class="panel">
    <h2>1. 러닝 기록 스크린샷</h2>
    <label class="btn primary" for="shot">스크린샷 선택</label>
    <input id="shot" type="file" accept="image/*">
    <img id="shotThumb" class="thumb" alt="">
    <div id="status"></div>
  </section>

  <section class="panel">
    <h2>2. 읽은 값 (틀리면 직접 수정)</h2>
    <div class="row">
      <div><label class="field" for="vTime">운동 시간</label><input id="vTime" type="text" inputmode="text" placeholder="0:30:02" autocomplete="off"></div>
      <div><label class="field" for="vKcal">칼로리 (kcal)</label><input id="vKcal" type="text" inputmode="numeric" placeholder="251" autocomplete="off"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label class="field" for="vDist">거리 (km)</label><input id="vDist" type="text" inputmode="decimal" placeholder="4.11" autocomplete="off"></div>
      <div class="chk" style="padding-top:18px"><input id="showDist" type="checkbox"><label for="showDist">거리도 표시</label></div>
    </div>
  </section>

  <section class="panel">
    <h2>3. 스타일</h2>
    <div class="row">
      <div><label class="field" for="ratio">비율</label>
        <select id="ratio">
          <option value="4:5">4:5 (피드)</option>
          <option value="1:1">1:1 (정사각)</option>
          <option value="9:16">9:16 (스토리)</option>
        </select></div>
      <div><label class="field" for="pos">글씨 위치</label>
        <select id="pos">
          <option value="center">가운데</option>
          <option value="bottom">아래</option>
          <option value="top">위</option>
        </select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label class="field" for="cBg">카드 배경색</label><input id="cBg" type="color" value="#101418"></div>
      <div><label class="field" for="cFg">글씨색</label><input id="cFg" type="color" value="#ffffff"></div>
      <div><label class="field" for="cAcc">강조색(라벨)</label><input id="cAcc" type="color" value="#c6ff3d"></div>
    </div>
    <div style="margin-top:14px">
      <label class="field" for="fsize">글씨 크기 <span id="fsizeVal"></span></label>
      <input id="fsize" type="range" min="50" max="130" step="5" value="100">
    </div>
    <div style="margin-top:14px">
      <div class="row">
        <label class="btn" for="bgPic">배경 사진 올리기 (선택)</label>
        <button id="bgClear" type="button" style="flex:0 0 90px">제거</button>
      </div>
      <input id="bgPic" type="file" accept="image/*">
      <div id="dimWrap" style="display:none;margin-top:12px">
        <label class="field" for="dim">사진 어둡게 <span id="dimVal"></span></label>
        <input id="dim" type="range" min="0" max="80" value="25">
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>미리보기</h2>
    <canvas id="preview"></canvas>
    <div class="row" style="margin-top:12px">
      <button id="btnShare" class="primary" type="button">저장 / 공유</button>
    </div>
    <p class="hint">아이폰: 「저장 / 공유」 → 「이미지 저장」을 누르세요. 안 되면 미리보기를 길게 눌러 저장할 수도 있어요.</p>
  </section>
</main>

<script src="vendor/tesseract.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('preview'), ctx = canvas.getContext('2d');
  const FONT = '-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", Helvetica, Arial, sans-serif';
  let bgImg = null;
  let worker = null;

  /* ---------- 상태 표시 ---------- */
  function status(msg, err = false) { const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }

  /* ---------- 이미지 로딩 ---------- */
  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => res({ img, url });
      img.onerror = () => rej(new Error('이미지를 열 수 없어요 (HEIC는 지원이 제한될 수 있어요)'));
      img.src = url;
    });
  }

  /* ---------- OCR 전처리: 어두운 배경 + 컬러 숫자 → 흰 배경 + 검은 글씨 ---------- */
  function preprocess(img) {
    const scale = Math.min(1, 1600 / img.naturalWidth);
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      const v = Math.max(p[i], p[i + 1], p[i + 2]);   // 컬러 숫자는 어느 채널이든 밝음
      const o = v > 110 ? 0 : 255;                    // 글씨=검정, 배경=흰색
      p[i] = p[i + 1] = p[i + 2] = o; p[i + 3] = 255;
    }
    g.putImageData(d, 0, 0);
    return c;
  }

  async function getWorker() {
    if (worker) return worker;
    const abs = p => new URL(p, location.href).href;
    worker = await Tesseract.createWorker('eng', 1, {
      workerPath: abs('vendor/worker.min.js'),
      corePath: abs('vendor/core/'),
      langPath: abs('vendor/lang/'),
      logger: m => { if (m.status === 'recognizing text') status(`글자 읽는 중… ${Math.round(m.progress * 100)}%`); }
    });
    await worker.setParameters({ tessedit_pageseg_mode: '11', preserve_interword_spaces: '1' });
    return worker;
  }

  /* ---------- OCR 결과에서 값 뽑기 ---------- */
  function parseResult(data) {
    const lines = [];
    (data.lines || []).forEach(l => lines.push({ text: l.text, x: l.bbox.x0, y: l.bbox.y0 }));
    // 단어 단위도 같이 (sparse 모드에서 한 줄에 두 칸이 붙을 수 있음)
    const words = (data.words || []).map(w => ({ text: w.text, x: w.bbox.x0, y: w.bbox.y0 }));
    const all = lines.concat(words);

    const times = [], kcals = [], dists = [];
    for (const t of all) {
      const s = t.text.replace(/[Oo]/g, '0').replace(/[|lI]/g, '1');
      for (const m of s.matchAll(/(\d{1,2})\s*[:;.]\s*([0-5]\d)\s*[:;.]\s*([0-5]\d)/g))
        times.push({ v: `${+m[1]}:${m[2]}:${m[3]}`, x: t.x, y: t.y });
      for (const m of t.text.matchAll(/(\d{2,4})\s*K?\s*C\s*A\s*L/gi))
        kcals.push({ v: m[1], x: t.x, y: t.y });
      for (const m of t.text.matchAll(/(\d{1,3}[.,]\d{1,2})\s*K\s*M/gi))
        dists.push({ v: m[1].replace(',', '.'), x: t.x, y: t.y });
    }
    const dedupe = a => { const seen = new Set(); return a.filter(o => { const k = o.v + '@' + Math.round(o.y / 20) + ',' + Math.round(o.x / 20); if (seen.has(k)) return false; seen.add(k); return true; }); };
    const byPos = (a, b) => a.y - b.y || a.x - b.x;
    const T = dedupe(times).sort(byPos), K = dedupe(kcals).sort(byPos), D = dedupe(dists).sort(byPos);

    // 운동 시간: 첫 번째(왼쪽 위) 시간 값 / 활동 칼로리: 가장 위쪽 kcal / 거리: 첫 번째 km
    return { time: T[0]?.v || '', kcal: K[0]?.v || '', dist: D[0]?.v || '', raw: { T, K, D } };
  }

  async function runOcr(img) {
    const pre = preprocess(img);
    const w = await getWorker();
    const { data } = await w.recognize(pre);
    return parseResult(data);
  }
  window.__runOcr = runOcr; // 테스트용

  /* ---------- 스크린샷 선택 ---------- */
  $('shot').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      status('이미지 불러오는 중…');
      const { img, url } = await loadImage(f);
      const th = $('shotThumb'); th.src = url; th.style.display = 'block';
      status('글자 엔진 준비 중… (처음에는 몇 초 걸려요)');
      const r = await runOcr(img);
      $('vTime').value = r.time; $('vKcal').value = r.kcal; $('vDist').value = r.dist;
      const miss = [!r.time && '시간', !r.kcal && '칼로리'].filter(Boolean);
      if (miss.length) status(`${miss.join('·')}을(를) 못 읽었어요. 직접 입력해주세요.`, true);
      else status('완료! 값이 맞는지 확인하세요.');
      draw();
    } catch (err) {
      console.error(err);
      status('읽기 실패: ' + (err.message || err) + ' — 값을 직접 입력할 수 있어요.', true);
    }
  });

  /* ---------- 배경 사진 ---------- */
  $('bgPic').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { bgImg = (await loadImage(f)).img; $('dimWrap').style.display = 'block'; draw(); }
    catch (err) { status(err.message, true); }
  });
  $('bgClear').addEventListener('click', () => { bgImg = null; $('bgPic').value = ''; $('dimWrap').style.display = 'none'; draw(); });

  /* ---------- 카드 그리기 ---------- */
  function sizeFor(ratio) {
    const W = 1080;
    return ratio === '1:1' ? [W, 1080] : ratio === '9:16' ? [W, 1920] : [W, 1350];
  }

  function draw() {
    const [W, H] = sizeFor($('ratio').value);
    canvas.width = W; canvas.height = H;
    const bg = $('cBg').value, fg = $('cFg').value, acc = $('cAcc').value;

    // 배경
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    if (bgImg) {
      const s = Math.max(W / bgImg.naturalWidth, H / bgImg.naturalHeight);
      const dw = bgImg.naturalWidth * s, dh = bgImg.naturalHeight * s;
      ctx.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
      const dim = +$('dim').value / 100;
      $('dimVal').textContent = Math.round(dim * 100) + '%';
      if (dim > 0) { ctx.fillStyle = `rgba(0,0,0,${dim})`; ctx.fillRect(0, 0, W, H); }
    }

    // 항목
    const items = [];
    const t = $('vTime').value.trim(), k = $('vKcal').value.trim(), d = $('vDist').value.trim();
    if ($('showDist').checked && d) items.push({ label: 'DISTANCE', value: d, unit: 'KM' });
    items.push({ label: 'TIME', value: t || '–:––:––', unit: '' });
    items.push({ label: 'CALORIES', value: k || '–––', unit: 'KCAL' });

    // 글씨 크기: 슬라이더 비율 적용. 항목이 많아 카드를 넘칠 땐 자동으로 줄여서 맞춘다.
    const fk = +$('fsize').value / 100;
    const layout = f => {
      const big = Math.round(W * 0.2 * f), lab = Math.round(W * 0.04 * f), unitSz = Math.round(W * 0.075 * f);
      const gap = Math.round(W * 0.07 * f);
      const blockH = lab + 18 + big;           // 라벨 + 간격 + 숫자
      return { big, lab, unitSz, gap, blockH, totalH: items.length * blockH + (items.length - 1) * gap };
    };
    let L = layout(fk);
    if (L.totalH > H * 0.84) L = layout(fk * (H * 0.84) / L.totalH);
    // 가로로 넘치는 경우(긴 시간 값 등)도 자동 축소
    ctx.font = `800 ${L.big}px ${FONT}`;
    const widest = Math.max(...items.map(it => ctx.measureText(it.value).width + (it.unit ? L.unitSz * 2.4 : 0)));
    if (widest > W * 0.92) L = layout((L.big / (W * 0.2)) * (W * 0.92) / widest);
    const { big, lab, unitSz, gap, blockH, totalH } = L;
    $('fsizeVal').textContent = Math.round(fk * 100) + '%';
    const pos = $('pos').value;
    let y0 = pos === 'top' ? H * 0.12 : pos === 'bottom' ? H - totalH - H * 0.1 : (H - totalH) / 2;

    ctx.textBaseline = 'alphabetic';
    const shadow = !!bgImg;
    items.forEach((it, i) => {
      const y = y0 + i * (blockH + gap);
      ctx.save();
      if (shadow) { ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 24; }
      // 라벨
      ctx.textAlign = 'center';
      ctx.fillStyle = acc; ctx.font = `700 ${lab}px ${FONT}`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = Math.round(lab * 0.25) + 'px';
      ctx.fillText(it.label, W / 2, y + lab);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      // 값 + 단위 (한 덩어리로 가운데 정렬)
      ctx.font = `800 ${big}px ${FONT}`;
      const vw = ctx.measureText(it.value).width;
      ctx.font = `800 ${unitSz}px ${FONT}`;
      const uw = it.unit ? ctx.measureText(it.unit).width + 16 : 0;
      const startX = (W - (vw + uw)) / 2, baseY = y + lab + 18 + big * 0.86;
      ctx.textAlign = 'left'; ctx.fillStyle = fg;
      ctx.font = `800 ${big}px ${FONT}`; ctx.fillText(it.value, startX, baseY);
      if (it.unit) { ctx.font = `800 ${unitSz}px ${FONT}`; ctx.fillText(it.unit, startX + vw + 16, baseY); }
      ctx.restore();
    });
  }
  window.__draw = draw;

  ['vTime', 'vKcal', 'vDist'].forEach(id => $(id).addEventListener('input', draw));
  ['showDist', 'ratio', 'pos', 'cBg', 'cFg', 'cAcc', 'dim', 'fsize'].forEach(id => $(id).addEventListener('input', draw));

  /* ---------- 저장 / 공유 ---------- */
  $('btnShare').addEventListener('click', async () => {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    if (!blob) return status('이미지 생성 실패', true);
    const file = new File([blob], 'running-card.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'running-card.png';
    document.body.appendChild(a); a.click(); a.remove();
  });

  draw();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW 등록 실패', err));
  }
})();
</script>
</body>
</html>
